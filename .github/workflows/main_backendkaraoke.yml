name: Build and deploy Python app to Azure Web App - backendkaraoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Zip artifact for deployment
        run: |
          zip -r release.zip . \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".venv/*" \
            --exclude "antenv/*" \
            --exclude "app/data/chunks/*" \
            --exclude "app/data/uploads/*" \
            --exclude "app/data/outputs/*" \
            --exclude "*/__pycache__/*" \
            --exclude "*.pyc" \
            --exclude "test_audio*" \
            --exclude "videos/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3C7A2756B7B144A7BC14864672885F42 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_747F1A3B2BD44BB29AFE0E1FBC26926D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_87E80AC2B9164CBDB7EA44AB13E03BF3 }}

      - name: Configure App Settings
        uses: azure/cli@v2
        with:
          inlineScript: |
            APP_NAME="backendkaraoke"
            RESOURCE_GROUP=$(az webapp list --query "[?name=='$APP_NAME'].resourceGroup | [0]" -o tsv)
            echo "App: $APP_NAME / RG: $RESOURCE_GROUP"
            az webapp config appsettings set \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --settings \
                SCM_DO_BUILD_DURING_DEPLOYMENT=true \
                ENABLE_ORYX_BUILD=true \
                WEBSITE_RUN_FROM_PACKAGE=0
            echo "Esperando estabilizacion..."
            sleep 30
            az webapp restart --name "$APP_NAME" --resource-group "$RESOURCE_GROUP"
            sleep 20

      - name: Deploy to Azure Web App
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "=== Archivos disponibles ==="
            ls -la
            echo "=== Deployando ==="
            RESOURCE_GROUP=$(az webapp list --query "[?name=='backendkaraoke'].resourceGroup | [0]" -o tsv)
            az webapp deploy \
              --name backendkaraoke \
              --resource-group "$RESOURCE_GROUP" \
              --src-path release.zip \
              --type zip \
              --async false \
              --timeout 600